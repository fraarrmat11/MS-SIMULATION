name: Deploy to Amazon ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy, usually the commit SHA produced by Build and Push Docker Images"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ECS services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image URIs
        id: images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY_MS_TIME: ${{ vars.ECR_REPOSITORY_MS_TIME }}
          ECR_REPOSITORY_MS_MAP: ${{ vars.ECR_REPOSITORY_MS_MAP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          MS_TIME_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY_MS_TIME:$IMAGE_TAG"
          MS_MAP_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY_MS_MAP:$IMAGE_TAG"
          echo "ms-time-image=$MS_TIME_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ms-map-image=$MS_MAP_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying ms-time image: $MS_TIME_IMAGE"
          echo "Deploying ms-map image: $MS_MAP_IMAGE"

      - name: Render ms-time task definition
        id: render-ms-time
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ vars.ECS_TASK_DEFINITION_MS_TIME }}
          container-name: ms-time
          image: ${{ steps.images.outputs.ms-time-image }}

      - name: Deploy ms-time service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ms-time.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_MS_TIME }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render ms-map task definition
        id: render-ms-map
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ vars.ECS_TASK_DEFINITION_MS_MAP }}
          container-name: ms-map
          image: ${{ steps.images.outputs.ms-map-image }}

      - name: Deploy ms-map service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ms-map.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_MS_MAP }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
