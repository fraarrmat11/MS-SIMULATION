name: Deploy to Amazon ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy, usually the commit SHA produced by Build and Push Docker Image"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ms-simulation ECS service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ms-simulation image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_MS_SIMULATION }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Deploying ms-simulation image: $IMAGE_URI"

      - name: Render ms-simulation task definition
        id: render-ms-simulation
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ vars.ECS_TASK_DEFINITION_MS_SIMULATION }}
          container-name: ms-simulation
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy ms-simulation service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ms-simulation.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_MS_SIMULATION }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
