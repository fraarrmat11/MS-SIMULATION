databaseChangeLog:
  - changeSet:
      id: 001-create-simulation-clock
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: simulation_clock
      changes:
        - createTable:
            tableName: simulation_clock
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_simulation_clock
                    nullable: false
              - column:
                  name: current_day
                  type: integer
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-truck-position
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: truck_position
      changes:
        - createTable:
            tableName: truck_position
            columns:
              - column:
                  name: truck_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_truck_position
                    nullable: false
              - column:
                  name: x_edge
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: y_edge
                  type: integer
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-warehouse-position
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: warehouse_position
      changes:
        - createTable:
            tableName: warehouse_position
            columns:
              - column:
                  name: warehouse_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_warehouse_position
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: x_edge
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: y_edge
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: warehouse_type
                  type: varchar(255)
