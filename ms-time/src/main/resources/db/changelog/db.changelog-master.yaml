databaseChangeLog:
  - changeSet:
      id: 001-create-simulation-clock
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: simulation_clock
      changes:
        - createTable:
            tableName: simulation_clock
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_simulation_clock
                    nullable: false
              - column:
                  name: current_day
                  type: integer
                  constraints:
                    nullable: false
